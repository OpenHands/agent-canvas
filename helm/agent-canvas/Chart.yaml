apiVersion: v2
name: agent-canvas
description: |
  Helm chart for running the OpenHands agent-canvas all-in-one image
  (frontend + agent-server + automation) as a StatefulSet with persistent
  storage, ingress, and optional cluster RBAC.
type: application
# Chart-level version. Bump on chart changes.
version: 0.1.0
# Default appVersion pins the same agent-server release as config/defaults.json.
# Override via --set image.tag=... to pull a different published image.
appVersion: "1.23.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/OpenHands/agent-canvas
sources:
  - https://github.com/OpenHands/agent-canvas
keywords:
  - openhands
  - agent
  - ai
  - agent-canvas
maintainers:
  - name: OpenHands
    url: https://github.com/OpenHands
